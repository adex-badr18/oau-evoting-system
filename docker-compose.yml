services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uevs
      POSTGRES_USER: uevs
      # Local development only. Use a managed secret in every shared or production environment.
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uevs -d uevs"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
